
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Prueba de estados mayoristas</title>
</head>
<body>

    <h2>Actualizar estado del pedido</h2>

    <button onclick="actualizarEstado()">
        Marcar pedido 2 como contactado
    </button>

    <pre id="resultado"></pre>

    <script>
        async function actualizarEstado() {
            const resultado = document.getElementById("resultado");

            try {
                const respuesta = await fetch(
                    "/api/mayoristas/actualizar_estado.php",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            id: 2,
                            estado: "contactado"
                        })
                    }
                );

                const datos = await respuesta.json();

                resultado.textContent = JSON.stringify(
                    datos,
                    null,
                    2
                );

            } catch (error) {
                resultado.textContent = error.message;
            }
        }
    </script>

</body>
</html>
